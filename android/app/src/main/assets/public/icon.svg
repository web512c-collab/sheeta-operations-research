<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer Subtle Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4"/>

  <!-- Operations Research Mathematical Glyph: Stylized Sigma and Polytope Matrix Nodes -->
  <g filter="url(#shadow)">
    <!-- Sigma Glyph -->
    <path d="M 148 132 L 364 132 L 364 176 L 256 256 L 364 336 L 364 380 L 148 380 L 148 336 L 272 336 L 188 274 L 188 238 L 272 176 L 148 176 Z" 
          fill="#ffffff" 
          stroke="#e0e7ff" 
          stroke-width="4" 
          stroke-linejoin="round"/>
          
    <!-- Feasible Region Simplex Polytope Dots -->
    <circle cx="380" cy="132" r="14" fill="#38bdf8"/>
    <circle cx="410" cy="256" r="14" fill="#10b981"/>
    <circle cx="380" cy="380" r="14" fill="#f59e0b"/>
    <line x1="380" y1="132" x2="410" y2="256" stroke="#38bdf8" stroke-width="4" stroke-dasharray="6 4" stroke-opacity="0.8"/>
    <line x1="410" y1="256" x2="380" y2="380" stroke="#10b981" stroke-width="4" stroke-dasharray="6 4" stroke-opacity="0.8"/>
  </g>
</svg>
