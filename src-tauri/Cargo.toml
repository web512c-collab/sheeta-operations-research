[package]
name = "sheeta-operations-research"
version = "1.0.0"
description = "Industrial-grade Operations Research solver and simulation suite"
authors = ["Sheeta OR Team"]
license = "Apache-2.0"
repository = "https://github.com/sheeta/operations-research"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
tauri-plugin-clipboard-manager = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
