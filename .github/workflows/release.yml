name: Release Tag Build & Publish (Obtainium APK + Desktop)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing Git tag to build and publish (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. Validate Codebase Before Packaging Release
  # =========================================================================
  test:
    name: Validate Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Typecheck & Lint
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Build Frontend Bundle
        run: npm run build

  # =========================================================================
  # 2. Build Android Debug APK for Obtainium / Direct Install
  # =========================================================================
  build-android-apk:
    name: Build Android Debug APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install

      - name: Build Frontend Distribution
        run: npm run build

      - name: Sync Capacitor Android
        run: npx @capacitor/cli sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage Versioned APK Asset
        run: |
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          APK_SOURCE=$(find android/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)
          if [ -z "$APK_SOURCE" ]; then
            echo "::error::No debug APK found after assembleDebug."
            exit 1
          fi
          mkdir -p release-assets
          cp "$APK_SOURCE" "release-assets/sheeta-operations-research-${TAG_NAME}-debug.apk"
          ls -lh release-assets/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-android-apk
          path: release-assets/*.apk
          if-no-files-found: error

  # =========================================================================
  # 3. Build Desktop Tauri 2 Installers
  # =========================================================================
  build-desktop:
    name: Build Desktop (${{ matrix.label }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 'macOS Apple Silicon'
            platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            artifact_name: 'release-macos-arm64'
          - label: 'macOS Intel (Cross-Compile)'
            platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            artifact_name: 'release-macos-x64'
          - label: 'Linux x86_64'
            platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            artifact_name: 'release-linux-x64'
          - label: 'Windows x86_64'
            platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            artifact_name: 'release-windows-x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux System Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config

      - name: Install Dependencies
        run: npm install

      - name: Build Tauri Desktop Bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}

      - name: Collect Installer Files
        shell: bash
        run: |
          mkdir -p staged-desktop
          find "src-tauri/target/${{ matrix.target }}/release/bundle" -type f \
            \( -name '*.dmg' -o -name '*.tar.gz' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' -o -name '*.msi' \) \
            -exec cp {} staged-desktop/ \;
          ls -lh staged-desktop/

      - name: Upload Desktop Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: staged-desktop/*
          if-no-files-found: error

  # =========================================================================
  # 4. Publish GitHub Release with APK & Desktop Installers
  # =========================================================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-android-apk, build-desktop]
    if: ${{ always() && needs.build-android-apk.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true

      - name: Verify Android APK Exists
        run: |
          ls -lh release-files/
          if ! compgen -G "release-files/*.apk" >/dev/null; then
            echo "::error::Android APK missing from release-files."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Sheeta Operations Research ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: release-files/*
