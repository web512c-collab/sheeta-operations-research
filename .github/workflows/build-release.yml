name: CI Build & Multi-Platform Packaging

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Validation, Typecheck, Unit Tests & Web/PWA Build
  # =========================================================================
  test:
    name: Test, Lint & Build Web PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Typecheck & Lint
        run: npm run lint

      - name: Run Unit Test Suite
        run: npm test

      - name: Build Web & PWA Bundle
        run: npm run build:pwa

      - name: Verify Web Build Output
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::Build verification failed: dist/index.html not found."
            exit 1
          fi

      - name: Upload Web PWA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sheeta-or-web-pwa
          path: dist/
          if-no-files-found: error

  # =========================================================================
  # 2. Desktop Matrix Build (Windows, macOS ARM64 & Intel, Linux via Tauri 2)
  # =========================================================================
  build-desktop-tauri:
    name: Desktop Tauri (${{ matrix.label }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 'macOS Apple Silicon'
            platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            artifact_name: 'sheeta-or-desktop-macos-arm64'
          - label: 'macOS Intel (Cross-Compile)'
            platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            artifact_name: 'sheeta-or-desktop-macos-x64'
          - label: 'Linux x86_64'
            platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            artifact_name: 'sheeta-or-desktop-linux-x64'
          - label: 'Windows x86_64'
            platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            artifact_name: 'sheeta-or-desktop-windows-x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux System Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config

      - name: Install Node Dependencies
        run: npm install

      - name: Build Tauri Desktop Bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}

      - name: Upload Desktop Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error

  # =========================================================================
  # 3. Mobile Build (Android Debug APK via Capacitor 8 + Java 21)
  # =========================================================================
  build-android:
    name: Mobile Android (Debug APK)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install

      - name: Build Frontend Distribution
        run: npm run build

      - name: Sync Capacitor Android
        run: npx @capacitor/cli sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify Android APK Output
        run: |
          APK_FILE=$(find android/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No debug APK generated in android/app/build/outputs/apk/debug"
            exit 1
          fi
          echo "Built APK: $APK_FILE"

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sheeta-or-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # =========================================================================
  # 4. Optional Mobile Build (iOS via Xcode & Capacitor 8 SPM)
  # Runs on manual dispatch or when repository variable ENABLE_IOS_BUILD == 'true'.
  # =========================================================================
  build-ios:
    name: Mobile iOS (Xcode Archive)
    needs: test
    runs-on: macos-latest
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_IOS_BUILD == 'true' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Frontend Distribution
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx @capacitor/cli sync ios

      - name: Build Unsigned iOS Archive (Capacitor 8 SPM)
        working-directory: ios/App
        run: |
          if [ -d App.xcworkspace ]; then
            xcodebuild -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath App.xcarchive \
              archive \
              CODE_SIGNING_ALLOWED=NO
          else
            xcodebuild -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath App.xcarchive \
              archive \
              CODE_SIGNING_ALLOWED=NO
          fi

      - name: Upload iOS Archive
        uses: actions/upload-artifact@v4
        with:
          name: sheeta-or-ios-archive
          path: ios/App/App.xcarchive
          if-no-files-found: error
