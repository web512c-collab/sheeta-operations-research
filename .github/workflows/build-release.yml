name: CI Build & Multi-Platform Packaging

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Validation, Typecheck, Unit Tests & Web/PWA Build
  # =========================================================================
  test:
    name: Test, Lint & Build Web PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        shell: bash
        run: |
          rm -f package-lock.json
          npm install --no-package-lock

      - name: Typecheck & Lint
        run: npm run lint

      - name: Run Unit Test Suite
        run: npm test

      - name: Build Web & PWA Bundle
        run: npm run build:pwa

      - name: Verify Web Build Output
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::Build verification failed: dist/index.html not found."
            exit 1
          fi

      - name: Upload Web PWA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sheeta-or-web-pwa
          path: dist/
          if-no-files-found: error

  # =========================================================================
  # 2. Desktop Matrix Build (Windows & Linux via Tauri 2)
  # =========================================================================
  build-desktop-tauri:
    name: Desktop Tauri (${{ matrix.label }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 'Linux x86_64'
            platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            bundles: 'deb,appimage'
            artifact_name: 'sheeta-or-desktop-linux-x64'
          - label: 'Windows x86_64'
            platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            bundles: 'nsis,msi'
            artifact_name: 'sheeta-or-desktop-windows-x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux System Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config

      - name: Install Node Dependencies
        shell: bash
        run: |
          rm -f package-lock.json
          npm install --no-package-lock

      - name: Build Tauri Desktop Bundle
        uses: tauri-apps/tauri-action@v0
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Upload Desktop Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error

  # =========================================================================
  # 3. Mobile Build (Android Debug APK via Capacitor 8 + Java 21)
  # =========================================================================
  build-android:
    name: Mobile Android (Debug APK)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install Dependencies
        shell: bash
        run: |
          rm -f package-lock.json
          npm install --no-package-lock

      - name: Build Frontend Distribution
        run: npm run build

      - name: Sync Capacitor Android
        run: npx --no-install @capacitor/cli sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --version
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify Android APK Output
        run: |
          APK_FILE=$(find android/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No debug APK generated in android/app/build/outputs/apk/debug"
            exit 1
          fi
          echo "Built APK: $APK_FILE"

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sheeta-or-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
