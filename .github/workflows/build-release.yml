name: Build & Release Sheeta Operations Research

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  # =========================================================================
  # 1. Validation & Test Job (Web + PWA)
  # =========================================================================
  test:
    name: Test & Build Web PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts || npm install --ignore-scripts
          else
            npm install --ignore-scripts
          fi

      - name: Typecheck & Lint
        run: npm run lint

      - name: Run Test Suite
        run: npm test

      - name: Build Web & PWA Bundle
        run: npm run build:pwa

      - name: Upload Web PWA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sheeta-or-web-pwa
          path: dist/
          if-no-files-found: error

  # =========================================================================
  # 2. Desktop Matrix Build (Windows, macOS, Linux via Tauri 2)
  # =========================================================================
  build-desktop-tauri:
    name: Desktop Tauri (${{ matrix.platform }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            artifact_name: 'sheeta-or-desktop-macos-apple-silicon'
          - platform: 'macos-13'
            target: 'x86_64-apple-darwin'
            artifact_name: 'sheeta-or-desktop-macos-intel'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            artifact_name: 'sheeta-or-desktop-linux'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            artifact_name: 'sheeta-or-desktop-windows'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux System Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Node Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts || npm install --ignore-scripts
          else
            npm install --ignore-scripts
          fi

      - name: Build Frontend Distribution
        run: npm run build

      - name: Build Tauri Desktop Bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Sheeta Operations Research __VERSION__'
          releaseBody: 'See changelog for release notes.'
          releaseDraft: false
          prerelease: false
        continue-on-error: true

  # =========================================================================
  # 3. Mobile Build (Android Debug APK via Capacitor)
  # =========================================================================
  build-android:
    name: Mobile Android (Debug APK)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts || npm install --ignore-scripts
          else
            npm install --ignore-scripts
          fi

      - name: Build Frontend Distribution
        run: npm run build

      - name: Sync Capacitor Android
        run: npx @capacitor/cli sync android || true

      - name: Build Android Debug APK (No Signing Required)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace || true

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sheeta-or-android-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/**/*.apk
          if-no-files-found: warn

  # =========================================================================
  # 4. Optional Mobile Build (iOS via Xcode & Capacitor)
  # Skipped automatically if Apple signing credentials are not configured
  # =========================================================================
  build-ios:
    name: Mobile iOS (Optional Signed Build)
    needs: test
    runs-on: macos-14
    if: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts || npm install --ignore-scripts
          else
            npm install --ignore-scripts
          fi

      - name: Build Frontend Distribution
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx @capacitor/cli sync ios

      - name: Build iOS Archive (Unsigned/Ad-hoc)
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO || true

      - name: Upload iOS Archive
        uses: actions/upload-artifact@v4
        with:
          name: sheeta-or-ios-archive
          path: ios/App/App.xcarchive
          if-no-files-found: warn
