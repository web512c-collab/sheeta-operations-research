name: Deploy Sheeta Operations Research to gh-pages Branch (Fallback)

# Disabled by default: only runs when manually triggered from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'pages-branch'
  cancel-in-progress: false

jobs:
  deploy-branch:
    name: Build and Deploy to gh-pages Branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        shell: bash
        run: |
          rm -f package-lock.json
          npm install --no-package-lock

      - name: Build Web PWA for GitHub Pages
        env:
          VITE_BASE: /sheeta-operations-research/
        run: npm run build:pwa

      - name: Verify Build Output
        run: |
          for file in dist/index.html dist/404.html dist/.nojekyll dist/manifest.webmanifest dist/sw.js; do
            if [ ! -f "$file" ]; then
              echo "::error::Build verification failed: $file does not exist."
              exit 1
            fi
          done
          echo "Verified all GitHub Pages PWA build artifacts exist in dist/."

      - name: Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
