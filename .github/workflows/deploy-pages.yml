name: Deploy Sheeta Operations Research to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# Do NOT cancel in-progress runs as we want to allow these production deployments to complete cleanly.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # =========================================================================
  # Build job: Build Vite + PWA bundle with sub-path base
  # =========================================================================
  build:
    name: Build PWA for GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Pages Configuration
        uses: actions/configure-pages@v5

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts || npm install --ignore-scripts
          else
            npm install --ignore-scripts
          fi

      - name: Build Web PWA for GitHub Pages
        env:
          VITE_BASE: /sheeta-operations-research/
        run: npm run build:pwa

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  # =========================================================================
  # Deployment job: Publish artifact to GitHub Pages
  # =========================================================================
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
