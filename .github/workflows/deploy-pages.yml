name: Deploy Sheeta Operations Research to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Job-level least-privilege permissions allow either GitHub Actions Pages deployment
# or automatic fallback publishing to the gh-pages branch when Pages API returns 404.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # =========================================================================
  # Build Job: Build & Verify PWA First, Then Configure GitHub Pages or Fallback
  # =========================================================================
  build:
    name: Build PWA for GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      pages_ready: ${{ steps.pages_check.outputs.pages_ready }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web PWA for GitHub Pages
        env:
          VITE_BASE: /sheeta-operations-research/
        run: npm run build:pwa

      - name: Verify Build Output
        run: |
          for file in dist/index.html dist/404.html dist/.nojekyll dist/manifest.webmanifest dist/sw.js; do
            if [ ! -f "$file" ]; then
              echo "::error::Build verification failed: $file does not exist."
              exit 1
            fi
          done
          echo "Verified all GitHub Pages PWA build artifacts exist in dist/."

      - name: Verify or Enable GitHub Pages Site
        id: pages_check
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ENABLEMENT_TOKEN: ${{ secrets.PAGES_ENABLEMENT_TOKEN }}
        run: |
          set +e
          RESPONSE=$(gh api "repos/${{ github.repository }}/pages" 2>&1)
          STATUS=$?
          set -e

          PAGES_READY="false"

          if [ "$STATUS" -eq 0 ]; then
            BUILD_TYPE=$(printf '%s' "$RESPONSE" | jq -r '.build_type // empty' 2>/dev/null || true)
            echo "GitHub Pages is enabled (build_type=${BUILD_TYPE:-unknown})."

            if [ "$BUILD_TYPE" = "workflow" ]; then
              PAGES_READY="true"
            else
              TOKEN_TO_USE="${PAGES_ENABLEMENT_TOKEN:-$GH_TOKEN}"
              echo "Attempting to switch GitHub Pages source to GitHub Actions..."
              set +e
              gh api -X PUT "repos/${{ github.repository }}/pages" -f build_type=workflow >/dev/null 2>&1 \
                || GH_TOKEN="$TOKEN_TO_USE" gh api -X PUT "repos/${{ github.repository }}/pages" -f build_type=workflow >/dev/null 2>&1
              UPDATE_STATUS=$?
              set -e
              if [ "$UPDATE_STATUS" -eq 0 ]; then
                echo "Updated GitHub Pages source to GitHub Actions."
                PAGES_READY="true"
              fi
            fi
          elif printf '%s' "$RESPONSE" | grep -qE "404|Not Found"; then
            echo "GitHub Pages site returned 404. Attempting automatic enablement..."
            TOKEN_TO_USE="${PAGES_ENABLEMENT_TOKEN:-$GH_TOKEN}"
            set +e
            GH_TOKEN="$TOKEN_TO_USE" gh api -X POST "repos/${{ github.repository }}/pages" -f build_type=workflow >/dev/null 2>&1
            ENABLE_STATUS=$?
            set -e

            if [ "$ENABLE_STATUS" -eq 0 ]; then
              echo "GitHub Pages enabled and configured for GitHub Actions."
              PAGES_READY="true"
            fi
          else
            echo "::warning::Unable to query GitHub Pages status: $RESPONSE"
          fi

          if [ "$PAGES_READY" != "true" ]; then
            echo "::warning::GitHub Pages 'GitHub Actions' source is not active for ${{ github.repository }}. Falling back to publishing dist/ to the 'gh-pages' branch."
            {
              echo "### GitHub Pages Fallback Active"
              echo ""
              echo "GitHub Pages Actions deployment could not be enabled automatically with the available token (\`404 Not Found\` / permission restricted), so the built PWA was published to the \`gh-pages\` branch instead."
              echo ""
              echo "To switch to native GitHub Actions Pages deployment:"
              echo "1. Open \`https://github.com/${{ github.repository }}/settings/pages\`"
              echo "2. Under **Build and deployment > Source**, select **GitHub Actions** (or **Deploy from a branch** -> \`gh-pages\` / \`/(root)\`)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "pages_ready=$PAGES_READY" >> "$GITHUB_OUTPUT"

      - name: Configure GitHub Pages
        if: steps.pages_check.outputs.pages_ready == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: steps.pages_check.outputs.pages_ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Upload Fallback Build Artifact
        if: steps.pages_check.outputs.pages_ready != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pages-dist-fallback
          path: dist/
          if-no-files-found: error

  # =========================================================================
  # Deployment Job (Primary): Publish Artifact via Official GitHub Pages
  # =========================================================================
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.pages_ready == 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # =========================================================================
  # Deployment Job (Fallback): Publish dist/ to gh-pages Branch Without Secrets
  # =========================================================================
  deploy-branch-fallback:
    name: Deploy Fallback to gh-pages Branch
    needs: build
    if: needs.build.outputs.pages_ready != 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download Built PWA Artifact
        uses: actions/download-artifact@v4
        with:
          name: pages-dist-fallback
          path: dist

      - name: Verify Downloaded Fallback Output
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::Fallback dist/index.html not found after artifact download."
            exit 1
          fi

      - name: Publish to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
